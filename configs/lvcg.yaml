# Supervised PTB-XL protocol shared by B0, V0 and every Quaternion-LVCG variant.
# Paths resolve relative to this YAML file, independent of the working directory.
data:
  root: ../../datasets/physionet.org/files/ptb-xl/1.0.3
  # LVCG preprocessing (paper Table 8): 100 Hz, band-pass 0.67-40 Hz. The per-lead
  # z-score is applied on the fly by qlvcg.models.standardize.
  cache: ../artifacts/ptbxl_100_bp_0p67_40
  sampling_rate: 100
  bandpass: [0.67, 40.0]
model:
  # The author's configs/train/lvcg_v5_gru.yaml, except lead_order: records are fed in
  # PTB-XL's native lead order, which is the order these direction rows are declared in.
  lvcg:
    time_len: 1000
    num_leads: 12
    lead_order: ptbxl
    beat_len: 128
    state_dim: 256
    max_beats: 20
    beat_encoder_stem: 48
    beat_encoder_stages: [96, 192, 256, 256]
    beat_encoder_blocks: [3, 3, 3, 2]
    beat_encoder_kernel: 7
    beat_encoder_dropout: 0.1
    gru_hidden_dim: 256
    gru_num_layers: 2
    gru_dropout: 0.1
    temporal_type: gru
    use_ttt: false
    decoder_initial_channels: 128
    decoder_hidden_channels: [128, 64, 64, 32, 32]
    rr_num_basis: 8
    proj_dim: 256
    proj_hidden: 512
    ecg_decoder_hidden: 128
    ecg_decoder_layers: 2
    fs: 100
    rr_lead_idx: 1
  traditional_vcg:
    channels: [32, 64, 128, 128]
    kernel: 7
    dropout: 0.1
  # V1 QDF-LVCG: the dynamic branch added beside the untouched V0 model.
  qdf_lvcg:
    embedding_dim: 128
    hidden: 64
    kernel: 7
    dropout: 0.1
    # A transition is undefined when an endpoint is below this fraction of the record's
    # 99th-percentile VCG magnitude (see qlvcg.quaternion_utils.valid_rotation_mask).
    min_magnitude_fraction: 0.02
    sign_continuity: true
    # Section G's optional extras, appended to every quaternion feature set when true.
    include_magnitude: false
    include_linear_velocity: false
  # V2 QDT-LVCG: a quaternion token per beat, fused into the beat tokens.
  qdt_lvcg:
    embedding_dim: 128
    hidden: 64
    kernel: 7
    dropout: 0.1
    min_magnitude_fraction: 0.02
    sign_continuity: true
    include_magnitude: false
    include_linear_velocity: false
protocol:
  # The V0A/V0B winner's objective, fixed for V1-V8 (master prompt section E):
  # classification | classification+auxiliary. Left null on purpose: V1-V8 refuse to
  # train until V0 has been compared and this line is filled in.
  objective: null
objective:
  # V0-B only. Auxiliary weights are the author's; lambda_cls is not in the author's
  # config (it had no classifier) and is 1.
  lambda_cls: 1.0
  lambda_ecg: 1.0
  lambda_beat: 1.0
  lambda_base: 1.0
  lambda_temporal: 0.1
  num_visible: 3
training:
  seed: 42
  epochs: 50
  patience: 10
  min_delta: 0.0001
  # Optimiser, batch size, clip and warmup are the paper's (Table 8). Linear warmup,
  # then cosine decay to zero over the full epoch budget.
  batch_size: 64
  lr: 0.0005
  weight_decay: 0.01
  warmup_steps: 2000
  gradient_clip: 1.0
  num_workers: 4
  cpu_threads: 4
  device: auto
  output: ../runs
  results: ../results
  reports: ../reports
